name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application bundles
        run: pnpm run build:vite

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            # No previous tag, get all commits
            git log --pretty=format:"- %s (%h)" > RELEASE_NOTES.md
          else
            # Get commits since last tag
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Build and publish release
        # Publish a single Windows target. Publishing NSIS and portable in the same
        # invocation can race and create two GitHub releases with the same tag,
        # leaving /releases/latest without the installer required by old clients.
        run: pnpm exec electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release with notes
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let notes = '';
            try { notes = fs.readFileSync('RELEASE_NOTES.md', 'utf8'); } catch (err) { core.warning('No RELEASE_NOTES.md found: ' + err.message); }
            const tag = context.ref.replace('refs/tags/', '');
            const { data: releases } = await github.rest.repos.listReleases({ owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            const matches = releases.filter((r) => r.tag_name === tag);
            if (matches.length === 0) { core.warning('No release found for tag ' + tag); }
            for (const release of matches) {
              await github.rest.repos.updateRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, body: notes });
            }
            core.info('Updated ' + matches.length + ' release(s) with notes');
