name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application bundles
        run: pnpm run build:vite

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          NOTES_FILE="release-notes/pt-PT/${GITHUB_REF_NAME}.md"
          if [ ! -s "$NOTES_FILE" ]; then
            echo "Falta o ficheiro obrigatório de notas PT-PT: $NOTES_FILE" >&2
            exit 1
          fi
          cp "$NOTES_FILE" RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Build and publish release
        run: pnpm exec electron-builder --win nsis --publish never

      - name: Publish release assets together
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-Setup.exe
            dist/*-Setup.exe.blockmap
            dist/latest.yml
          fail_on_unmatched_files: true

      - name: Update release with notes
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let notes = '';
            try { notes = fs.readFileSync('RELEASE_NOTES.md', 'utf8'); } catch (err) { core.warning('No RELEASE_NOTES.md found: ' + err.message); }
            const tag = context.ref.replace('refs/tags/', '');
            const { data: releases } = await github.rest.repos.listReleases({ owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            const matches = releases.filter((r) => r.tag_name === tag);
            if (matches.length === 0) { core.warning('No release found for tag ' + tag); }
            for (const release of matches) {
              await github.rest.repos.updateRelease({ owner: context.repo.owner, repo: context.repo.repo, release_id: release.id, body: notes });
            }
            core.info('Updated ' + matches.length + ' release(s) with notes');
